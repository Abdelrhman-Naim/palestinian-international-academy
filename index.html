<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo-wep.webp?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/logo-wep.webp?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <script>
      (function() {
        function markLoaded() {
          document.documentElement.classList.add('fonts-loaded');
        }
        if ('fonts' in document) {
          if (document.fonts.check('24px "Material Symbols Outlined"')) {
            markLoaded();
          } else {
            document.fonts.load('24px "Material Symbols Outlined"').then(markLoaded).catch(markLoaded);
            document.fonts.ready.then(markLoaded);
            setTimeout(markLoaded, 400);
          }
        } else {
          markLoaded();
        }
      })();
    </script>
    <script>
      // Apply theme immediately according to system preference to prevent any white/dark flash
      (function() {
        try {
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var manual = localStorage.getItem('theme_manual');
          var isDark = manual ? (manual === 'dark') : systemDark;

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      @keyframes preloader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preloader-spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes preloader-dot {
        0%, 100% { transform: scale(0.8); opacity: 0.35; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes preloader-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      /* Dark mode styling for initial preloader */
      html.dark #app-preloader {
        background-color: #12100e !important;
      }
      html.dark #app-preloader > div {
        background: rgba(24, 24, 27, 0.95) !important;
        border-color: rgba(212, 175, 55, 0.35) !important;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7) !important;
      }
      html.dark #app-preloader h3 {
        color: #f5f5f4 !important;
      }
      html.dark #app-preloader p {
        color: #a8a29e !important;
      }
    </style>
    <title>أكاديمية فلسطين الدولية (PALESTINIAN INTERNATIONAL ACADEMY (PIA))</title>
  </head>
  <body>
    <div id="root">
      <!-- Instant Circular Preloader (Immune to white screen on slow network refresh) -->
      <div id="app-preloader" style="position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background-color: #FAF7F2; font-family: 'Alexandria', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: background-color 0.3s; padding: 16px;">
        <div style="position: relative; max-width: 360px; width: 92%; padding: 32px 24px; border-radius: 24px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 20px 50px rgba(212, 175, 55, 0.2); display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden;">
          
          <!-- Ambient gold blur behind circle -->
          <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 160px; height: 160px; background: radial-gradient(circle, rgba(212, 175, 55, 0.35) 0%, rgba(212, 175, 55, 0) 70%); border-radius: 50%; pointer-events: none;"></div>

          <!-- Circular Spinner Centerpiece -->
          <div style="position: relative; width: 104px; height: 104px; margin: 8px 0 16px 0; display: flex; align-items: center; justify-content: center;">
            <!-- Outer spinning ring -->
            <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #d4af37; border-right-color: #f59e0b; animation: preloader-spin 1.2s linear infinite;"></div>
            <!-- Middle reverse dashed ring -->
            <div style="position: absolute; inset: 10px; border-radius: 50%; border: 2px dashed rgba(212, 175, 55, 0.45); border-bottom-color: #b38b22; animation: preloader-spin-rev 2.4s linear infinite;"></div>
            <!-- Center golden badge with emblem -->
            <div style="position: relative; z-index: 2; width: 50px; height: 50px; border-radius: 16px; background: linear-gradient(135deg, #b38b22 0%, #d4af37 50%, #fef08a 100%); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); display: flex; align-items: center; justify-content: center; animation: preloader-pulse 1.8s ease-in-out infinite;">
              <svg style="width: 28px; height: 28px; fill: #ffffff;" viewBox="0 0 24 24">
                <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
              </svg>
            </div>
          </div>

          <!-- Typography -->
          <div style="position: relative; z-index: 2; margin-top: 8px;">
            <h3 style="font-size: 20px; font-weight: 800; color: #1c1917; margin: 0 0 6px 0; letter-spacing: 0.5px;">جاري تجهيز المنصة...</h3>
            <p style="font-size: 12px; font-weight: 500; color: #78716c; line-height: 1.6; margin: 0; max-width: 260px;">يتم الآن تحميل عناصر النظام بأعلى جودة، يرجى الانتظار لحظات...</p>
          </div>

          <!-- Progress dots & track -->
          <div style="position: relative; z-index: 2; margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 8px; height: 8px; border-radius: 50%; background-color: #d4af37; animation: preloader-dot 1.2s ease-in-out infinite 0s;"></span>
              <span style="width: 8px; height: 8px; border-radius: 50%; background-color: #d4af37; animation: preloader-dot 1.2s ease-in-out infinite 0.2s;"></span>
              <span style="width: 8px; height: 8px; border-radius: 50%; background-color: #d4af37; animation: preloader-dot 1.2s ease-in-out infinite 0.4s;"></span>
            </div>
            <div style="width: 140px; height: 4px; border-radius: 999px; background: rgba(212, 175, 55, 0.2); overflow: hidden; position: relative;">
              <div style="position: absolute; top: 0; bottom: 0; width: 60px; background: linear-gradient(90deg, transparent, #d4af37, transparent); border-radius: 999px; animation: preloader-shimmer 1.6s infinite ease-in-out;"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <p>يرجى تفعيل الجافاسكريبت لتشغيل المنصة.</p>
        <a href="/privacy">سياسة الخصوصية | Privacy Policy</a>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
